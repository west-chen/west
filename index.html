  equipBox.style.cssText = `
    background: rgba(30,20,10,.6);
    border: 1px dashed #6b5333; border-radius: 12px;
    padding: 60px 20px; text-align: center;
    color: #8a7a5a; font-size: 15px; line-height: 2;
    letter-spacing: 2px;
  `;
  equipBox.innerHTML = `
    <div style="font-size:40px;margin-bottom:12px;">🎒</div>
    <div>未 装 备 的 装 备</div>
    <div style="font-size:12px;margin-top:8px;">（装 备 系 统 将 在 后 续 版 本 加 入）</div>
  `;
  wrap.appendChild(equipBox);

  panel.appendChild(wrap);
}

function renderSaveTab(panel) {
  panel.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'savePanel';
  const data = loadSaveData();
  let infoHtml = '';
  if (data) {
    const d = new Date(data.savedAt);
    const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    infoHtml = `
      <div><span class="label">阵营：</span><span class="value">${data.playerFaction || '未知'}</span></div>
      <div><span class="label">金币：</span><span class="value">${data.gold || 0}</span></div>
      <div><span class="label">天数：</span><span class="value">第 ${data.day || 1} 天</span></div>
      <div><span class="label">武将：</span><span class="value">${(data.playerHeroes || []).length} 人</span></div>
      <div><span class="label">俘虏：</span><span class="value">${(data.capturedHeroes || []).length} 人</span></div>
      <div><span class="label">存档时间：</span><span class="value">${timeStr}</span></div>
    `;
  } else {
    infoHtml = '<div class="empty">暂 无 存 档</div>';
  }
  wrap.innerHTML = `
    <div class="saveInfo">${infoHtml}</div>
    <div class="saveActions">
      <button class="saveAction" id="doSaveBtn">保 存 游 戏</button>
      <button class="loadAction" id="doLoadBtn" ${data ? '' : 'disabled'}>读 取 存 档</button>
    </div>
  `;
  panel.appendChild(wrap);
  document.getElementById('doSaveBtn').onclick = () => {
    const ok = saveGame();
    if (ok) { showToast('游戏已保存', 1200); renderSaveTab(panel); }
    else showToast('保存失败', 1200);
  };
  document.getElementById('doLoadBtn').onclick = () => {
    if (!data) return;
    const confirmLoad = confirm('读取存档会覆盖当前进度，确定吗？');
    if (!confirmLoad) return;
    restoreFromSave(data);
    document.getElementById('campScreen').style.display = 'none';
    if (mode !== STATE.MAP) {
      G.battle = null;
      G.anim = null;
      mode = STATE.MAP;
      hideCmdMenu(); hideUnitInfo(); hideHint();
      document.getElementById('btnEndTurn').style.display = 'none';
      document.getElementById('btnBack').style.display = 'none';
      document.getElementById('infoLeft').textContent = '大地图';
    }
    document.getElementById('campBtn').style.display = 'block';
    showToast('已读取存档', 1200);
    log('已读取存档。');
  };
}

document.getElementById('campBtn').onclick = openCamp;
document.getElementById('campClose').onclick = closeCamp;
document.querySelectorAll('.campTab').forEach(tab => {
  tab.onclick = () => switchCampTab(tab.dataset.tab);
});

/* ======================== 存档序列化 ======================== */

function serializeHero(h) {
  return {
    heroName: h.heroName, cls: h.cls, isHistorical: h.isHistorical,
    level: h.level || 1, exp: h.exp || 0,
    hp: h.hp, maxHp: h.maxHp, dead: h.dead || false,
    growth: h.growth,
    trait: h.trait || null,
    forcedRank: h.forcedRank || null,
  };
}
function deserializeHero(o) {
  return {
    heroName: o.heroName,
    heroImg: o.isHistorical ? (HERO_DATA.heroes[o.heroName] || '') : randomHeroImg(),
    cls: o.cls,
    isHistorical: o.isHistorical,
    level: o.level || 1,
    exp: o.exp || 0,
    hp: o.hp !== undefined ? o.hp : null,
    maxHp: o.maxHp !== undefined ? o.maxHp : null,
    dead: o.dead || false,
    growth: o.growth || RANK_GROWTH['名将'],
    trait: o.trait || null,
    forcedRank: o.forcedRank || null,
  };
}
function serializeEnemy(e) {
  return {
    col: e.col, row: e.row, x: e.x, y: e.y,
    hp: e.hp, maxHp: e.maxHp,
    heroName: e.heroName, heroImg: e.heroImg,
    cls: e.cls, faction: e.faction,
    isHistorical: e.isHistorical,
    level: e.level || 1,
    rank: e.rank,
    trait: e.trait || null,
    growth: e.growth || null,
    enemyCount: e.enemyCount,
    targetCol: e.targetCol, targetRow: e.targetRow,
    moveCooldown: e.moveCooldown,
  };
}
function deserializeEnemy(o) {
  return Object.assign({}, o, { vx: 0, vy: 0, speed: 0, r: 16 });
}

function saveGame() {
  const data = {
    version: 3, savedAt: Date.now(),
    playerFaction: G.playerFaction,
    playerHeroes: G.playerHeroes.map(serializeHero),
    formation: G.formation,
    capturedHeroes: G.capturedHeroes,
    usedHeroes: Array.from(G.usedHeroes.entries()),
    day: G.day, moveSteps: G.moveSteps, lastSpawnStep: G.lastSpawnStep,
    gold: G.gold,
    player: {
      x: G.player.x, y: G.player.y,
      gridCol: G.player.gridCol, gridRow: G.player.gridRow,
    },
    enemies: G.enemies.map(serializeEnemy),
  };
  try {
    localStorage.setItem('sanguo_save_v1', JSON.stringify(data));
    return true;
  } catch (e) { console.warn('保存失败:', e); return false; }
}
function loadSaveData() {
  try {
    const s = localStorage.getItem('sanguo_save_v1');
    if (!s) return null;
    return JSON.parse(s);
  } catch (e) { return null; }
}
function restoreFromSave(data) {
  G.playerFaction = data.playerFaction;
  G.playerHeroes = data.playerHeroes.map(deserializeHero);
  G.formation = data.formation || [null,null,null,null,null,null,null,null,null];
  G.capturedHeroes = data.capturedHeroes || [];
  G.usedHeroes = new Map(data.usedHeroes || []);
  G.day = data.day || 1;
  G.moveSteps = data.moveSteps || 0;
  G.lastSpawnStep = data.lastSpawnStep || 0;
  G.gold = data.gold || 100;
  generateTerrain();
  initCities();
  G.player.x = data.player.x;
  G.player.y = data.player.y;
  G.player.gridCol = data.player.gridCol;
  G.player.gridRow = data.player.gridRow;
  G.player.path = [];
  G.player.moving = false;
  G.player.invuln = 0;
  G.enemies = (data.enemies || []).map(deserializeEnemy);
  cam.x = clamp(G.player.x - W / 2, 0, Math.max(0, MAP_W - W));
  cam.y = clamp(G.player.y - H / 2, 0, Math.max(0, MAP_H - H));
  updateGoldUI();
}

/* ======================== 主循环 ======================== */

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (mode === STATE.MAP) {
    updateMap(dt);
    drawMap();
    document.getElementById('infoRight').textContent = '日：' + G.day;
  } else if (mode === STATE.BATTLE) {
    drawBattle();
  } else if (mode === STATE.ANIM) {
    updateAnim(dt);
    drawBattle();
    drawAnim();
  }
  requestAnimationFrame(loop);
}

/* ======================== 输入 ======================== */

function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

canvas.addEventListener('pointerdown', e => {
  const p = pointerPos(e);
  if (mode === STATE.ANIM) {
    if (G.anim && G.anim.type === 'battle') {
      const d = G.anim.done;
      G.anim = null;
      mode = G.battle ? STATE.BATTLE : STATE.MAP;
      if (typeof d === 'function') d();
    }
    return;
  }
  if (mode === STATE.MAP) {
    const worldX = p.x + cam.x;
    const worldY = p.y + cam.y;
    const g = worldToGrid(worldX, worldY);
    if (!terrainWalkable(g.col, g.row)) {
      showToast('那里无法通行', 800);
      return;
    }
    const path = findPathGrid(G.player.gridCol, G.player.gridRow, g.col, g.row);
    if (!path || path.length === 0) {
      showToast('找不到路径', 800);
      return;
    }
    G.player.path = path;
    G.player.pathIdx = 0;
    G.player.moving = true;
  } else if (mode === STATE.BATTLE) {
    battleClick(p.x, p.y);
  }
});

document.getElementById('btnEndTurn').onclick = () => {
  if (mode === STATE.BATTLE && !G.anim && G.battle && G.battle.phase === PHASE.SELECT) {
    endTurn();
  } else {
    log('请先完成当前单位行动。');
  }
};
document.getElementById('btnBack').onclick = () => {
  if (mode === STATE.BATTLE && G.battle) tryRetreat();
};

/* ======================== 启动 ======================== */

loadAllAssets().then(() => {
  showBirthScreen();
});
</script>
